name: Lean AlphaOmega

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elan
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile elan-init.ps1
          powershell -ExecutionPolicy Bypass -File .\elan-init.ps1 -NoPrompt 1 -NoModifyPath 1 -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Lake packages and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            formal/lean/.lake
            ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean', 'formal/lean/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-

      - name: Build AlphaOmega
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup\invoke_lake.ps1 build AlphaOmega

      - name: Scan for proof placeholders
        shell: pwsh
        run: |
          $matches = Select-String -Path "formal\lean\*.lean","formal\lean\**\*.lean" -Pattern "\b(sorry|admit|axiom)\b"
          if ($matches) {
            $matches
            exit 1
          }

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

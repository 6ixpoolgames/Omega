name: Lean AlphaOmega

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/lean-alphaomega.yml"
      - "formal/lean/**"
      - "scripts/setup/invoke_lake.ps1"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/lean-alphaomega.yml"
      - "formal/lean/**"
      - "scripts/setup/invoke_lake.ps1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elan
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile elan-init.ps1
          .\elan-init.ps1 -NoPrompt $true -NoModifyPath $true -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Mathlib cache
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup\invoke_lake.ps1 exe cache get

      - name: Build AlphaOmega
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup\invoke_lake.ps1 build AlphaOmega

      - name: Scan for proof placeholders
        shell: pwsh
        run: |
          $matches = Select-String -Path "formal\lean\*.lean","formal\lean\**\*.lean" -Pattern "\b(sorry|admit|axiom)\b"
          if ($matches) {
            $matches
            exit 1
          }

      - name: Scan AlphaCore claim boundary
        shell: pwsh
        run: |
          $terms = @(
            "omega",
            "value",
            "valuer",
            "agent",
            "agency",
            "life",
            "living",
            "ethic",
            "moral",
            "preference",
            "utility",
            "reward",
            "alignment",
            "uncertainty",
            "viability",
            "completion",
            "lush",
            "self",
            "identity",
            "death"
          )

          $paths = @("formal\lean\AlphaCore.lean")
          $paths += Get-ChildItem -Path "formal\lean\AlphaCore" -Filter "*.lean" -File | ForEach-Object { $_.FullName }

          $offenders = @()
          foreach ($path in $paths) {
            $text = (Get-Content -LiteralPath $path -Raw).ToLowerInvariant()
            foreach ($term in $terms) {
              $pattern = "\b$([System.Text.RegularExpressions.Regex]::Escape($term))\b"
              if ($text -match $pattern) {
                $offenders += "${path}:$term"
              }
            }
          }

          if ($offenders.Count -gt 0) {
            $offenders
            exit 1
          }

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

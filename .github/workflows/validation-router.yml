name: Validation Router

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  statuses: write

jobs:
  route:
    name: Route validation
    runs-on: ubuntu-latest

    steps:
      - name: Mark classic commit status pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"Validation Router\",\"description\":\"Validation router is running\",\"target_url\":\"$TARGET_URL\"}" \
          || echo "Warning: unable to publish pending classic commit status"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            base="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          else
            base="${{ github.event.before }}"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          git diff --name-only "$base" HEAD | sort > changed_files.txt

      - name: Check pushed diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ steps.changes.outputs.base }}" HEAD

      - name: Report validation routing
        shell: bash
        run: |
          set -euo pipefail

          lean_scope="no"
          baseline_scope="no"
          adapter_scope="no"
          agency_scope="no"

          if grep -Eq '^(\.github/workflows/lean-alphaomega\.yml|formal/lean/|scripts/setup/invoke_lake\.ps1$)' changed_files.txt; then
            lean_scope="yes"
          fi

          if grep -Eq '^(\.github/workflows/baseline-witness-smoke\.yml|omega/baseline_witnesses/|omega/future_field_atlas/util\.py$|omega/validation/|tests/test_.*\.py|scripts/validation/run_baseline_witness_(family_)?smoke\.ps1$|results/baseline_witnesses/|pyproject\.toml$)' changed_files.txt; then
            baseline_scope="yes"
          fi

          if grep -Eq '^(\.github/workflows/finite-relational-adapter-smoke\.yml|omega/adapters/finite_relational/|omega/validation/finite_relational_adapter_(smoke|adversarial)\.py$|tests/test_(finite_relational_adapter|derived_graph_adapter|finite_grid_adapter|finite_relational_adapter_smoke|finite_relational_adapter_adversarial)\.py$|pyproject\.toml$)' changed_files.txt; then
            adapter_scope="yes"
          fi

          if grep -Eq '^(\.github/workflows/agency-diamond-midscale\.yml|omega/agency_diamond/|omega/validation/agency_diamond_midscale\.py$|tests/test_agency_diamond_midscale\.py$|pyproject\.toml$)' changed_files.txt; then
            agency_scope="yes"
          fi

          {
            echo "### Validation routing"
            echo ""
            echo "This workflow is the cheap always-on external check. It does not replace the path-scoped Lean or baseline witness workflows."
            echo ""
            echo "| Heavy workflow | Relevant changed paths detected |"
            echo "| --- | --- |"
            echo "| Lean AlphaOmega | $lean_scope |"
            echo "| Baseline Witness Smoke | $baseline_scope |"
            echo "| Finite Relational Adapter Smoke | $adapter_scope |"
            echo "| Agency Diamond Midscale | $agency_scope |"
            echo ""
            echo "Changed files:"
            echo ""
            if [[ -s changed_files.txt ]]; then
              while IFS= read -r file; do
                echo "- \`$file\`"
              done < changed_files.txt
            else
              echo "- none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish classic commit status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          case "${{ job.status }}" in
            success)
              state="success"
              description="Validation router passed"
              ;;
            failure)
              state="failure"
              description="Validation router failed"
              ;;
            cancelled)
              state="error"
              description="Validation router was cancelled"
              ;;
            *)
              state="error"
              description="Validation router ended with unknown status"
              ;;
          esac

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"Validation Router\",\"description\":\"$description\",\"target_url\":\"$TARGET_URL\"}" \
          || echo "Warning: unable to publish final classic commit status"

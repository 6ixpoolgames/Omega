[project]
name = "omega-multifield"
version = "0.1.0"
description = "Omega Multifield validation harness and analysis tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "sympy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "pymupdf>=1.24",
  "psutil>=6.0",
  "tqdm>=4.66",
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
fast = [
  "numba>=0.59",
  "joblib>=1.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
py-modules = ["omega_multifield_kill_test"]
